<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 840px; height: 560px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0a0e1a;
    color: #e2e8f0;
    position: relative;
  }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 420px 300px at 12% -5%, rgba(29,99,237,.32), transparent 65%),
      radial-gradient(ellipse 380px 280px at 100% 110%, rgba(56,189,248,.18), transparent 60%),
      #0a0e1a;
  }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(30,45,74,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,45,74,.5) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .layer {
    position: relative;
    width: 250px;
    padding: 18px 26px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .02em;
    border: 1px solid;
  }
  .layer small {
    display: block;
    font-size: 12px;
    font-weight: 600;
    opacity: .75;
    margin-top: 2px;
  }
  .layer::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 6px;
    border-radius: 0 0 12px 12px;
    opacity: .55;
  }
  .l-app  { background: rgba(56,189,248,.1);  border-color: rgba(56,189,248,.35);  color: #7dd3fc; }
  .l-app::after  { background: rgba(56,189,248,.35); }
  .l-cont { background: rgba(29,99,237,.14);  border-color: rgba(29,99,237,.45);  color: #93b4fb; }
  .l-cont::after { background: rgba(29,99,237,.45); }
  .l-runt { background: rgba(249,115,22,.1);  border-color: rgba(249,115,22,.4);  color: #fdba74; }
  .l-runt::after{ background: rgba(249,115,22,.4); }
  .l-kern { background: rgba(50,108,229,.12); border-color: rgba(50,108,229,.45); color: #a5b4fc; }
  .l-kern::after{ background: rgba(50,108,229,.45); }
  .connector { width: 1px; height: 14px; background: linear-gradient(rgba(56,189,248,.6), rgba(30,45,74,.4)); }
  .badge {
    position: absolute;
    right: -26px; top: 50%;
    transform: translateY(-50%);
    background: #0f1524;
    border: 1px solid #243657;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    color: #64748b;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .hex { position: absolute; opacity: .08; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <svg class="hex" style="width:220px;height:220px;left:-40px;bottom:-50px" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 52 20.5v23L32 56 12 43.5v-23Z" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 17 44.5 24.2v14.6L32 46 19.5 38.8V24.2Z" fill="#38bdf8"/>
  </svg>
  <svg class="hex" style="width:120px;height:120px;right:24px;top:20px;opacity:.06" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 52 20.5v23L32 56 12 43.5v-23Z" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 17 44.5 24.2v14.6L32 46 19.5 38.8V24.2Z" fill="#818cf8"/>
  </svg>
  <div class="stage">
    <div class="stack">
      <div class="layer l-app">Aplicación<small>tu código, listo para empaquetar</small></div>
      <div class="connector"></div>
      <div class="layer l-cont">Contenedor<small>imagen + entorno aislado</small><span class="badge">OCI</span></div>
      <div class="connector"></div>
      <div class="layer l-runt">Container Runtime<small>containerd + runc</small></div>
      <div class="connector"></div>
      <div class="layer l-kern">Kernel Linux<small>namespaces · cgroups · overlayfs</small></div>
    </div>
  </div>
</body>
</html>
