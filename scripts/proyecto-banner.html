<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 420px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0a0e1a;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 700px 360px at 15% 0%, rgba(29,99,237,.28), transparent 65%),
      radial-gradient(ellipse 640px 340px at 85% 110%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(ellipse 480px 300px at 60% -20%, rgba(50,108,229,.2), transparent 60%),
      #0a0e1a;
  }
  .grid { position: absolute; inset: 0; opacity: .45;
    background-image:
      linear-gradient(rgba(30,45,74,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,45,74,.5) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .net { position: relative; width: 1240px; }
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid;
    white-space: nowrap;
    text-align: center;
    box-shadow: 0 0 24px rgba(56,189,248,.12);
  }
  .node small { display: block; font-size: 10.5px; font-weight: 600; opacity: .7; margin-top: 2px; }
  .n-front  { left: 8%;  top: 30%; background: rgba(29,99,237,.16);  border-color: rgba(29,99,237,.5);  color: #93b4fb; }
  .n-gw     { left: 30%; top: 22%; background: rgba(129,140,248,.14); border-color: rgba(129,140,248,.5); color: #a5b4fc; }
  .n-mic1   { left: 52%; top: 38%; background: rgba(249,115,22,.12); border-color: rgba(249,115,22,.45); color: #fdba74; }
  .n-mic2   { left: 52%; top: 66%; background: rgba(249,115,22,.12); border-color: rgba(249,115,22,.45); color: #fdba74; }
  .n-db     { left: 78%; top: 30%; background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.45); color: #86efac; }
  .n-cache  { left: 94%; top: 62%; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.45); color: #fca5a5; }
  .n-pod    { left: 78%; top: 74%; background: rgba(168,85,247,.12); border-color: rgba(168,85,247,.45); color: #d8b4fe; }
  svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hex { position: absolute; opacity: .07; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <svg class="hex" style="width:260px;height:260px;left:20px;bottom:-70px" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 52 20.5v23L32 56 12 43.5v-23Z" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 17 44.5 24.2v14.6L32 46 19.5 38.8V24.2Z" fill="#38bdf8"/>
  </svg>
  <svg class="hex" style="width:150px;height:150px;right:40px;top:10px;opacity:.06" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 52 20.5v23L32 56 12 43.5v-23Z" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 17 44.5 24.2v14.6L32 46 19.5 38.8V24.2Z" fill="#818cf8"/>
  </svg>
  <div class="net">
    <svg class="lines" viewBox="0 0 1240 420" fill="none">
      <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/>
          <stop offset="1" stop-color="#818cf8" stop-opacity=".35"/>
        </linearGradient>
      </defs>
      <path d="M150 130 L370 96" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M370 96 L640 160" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M370 96 L640 280" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M640 160 L960 130" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M640 160 L960 130" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M640 280 L960 130" stroke="url(#lg1)" stroke-width="1.6" opacity=".55"/>
      <path d="M640 280 L960 312" stroke="url(#lg1)" stroke-width="1.6" opacity=".7"/>
      <path d="M640 160 L1170 262" stroke="url(#lg1)" stroke-width="1.6" opacity=".6"/>
      <path d="M960 130 L1170 262" stroke="url(#lg1)" stroke-width="1.6" opacity=".45"/>
      <path d="M150 130 L1170 262" stroke="url(#lg1)" stroke-width="1.2" opacity=".18"/>
      <circle cx="150" cy="130" r="4" fill="#38bdf8" opacity=".9"/>
      <circle cx="370" cy="96" r="4" fill="#a5b4fc" opacity=".9"/>
      <circle cx="640" cy="160" r="4" fill="#fdba74" opacity=".9"/>
      <circle cx="640" cy="280" r="4" fill="#fdba74" opacity=".9"/>
      <circle cx="960" cy="130" r="4" fill="#86efac" opacity=".9"/>
      <circle cx="960" cy="312" r="4" fill="#d8b4fe" opacity=".9"/>
      <circle cx="1170" cy="262" r="4" fill="#fca5a5" opacity=".9"/>
    </svg>

    <div class="node n-front">Internet<small>NGINX Ingress</small></div>
    <div class="node n-gw">API Gateway</div>
    <div class="node n-mic1">Microservicio A<small>Python · Go · Node</small></div>
    <div class="node n-mic2">Microservicio B<small>Python · Go · Node</small></div>
    <div class="node n-db">PostgreSQL<small>PersistentVolume</small></div>
    <div class="node n-cache">Redis</div>
    <div class="node n-pod">Pod autoscaling<small>HPA · Rolling update</small></div>
  </div>
</body>
</html>
