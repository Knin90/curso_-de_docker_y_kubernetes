<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contenedores y Orquestación Profesional</title>

  <meta name="description" content="Curso profesional de Docker, Docker Compose y Kubernetes: de cero hasta despliegues empresariales. 23 niveles, 140 módulos, 120 laboratorios." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ContainersPro" />
  <meta property="og:title" content="Contenedores y Orquestación Profesional" />
  <meta property="og:description" content="Docker, Docker Compose y Kubernetes: de cero hasta despliegues empresariales. 23 niveles · 140 módulos · 120 laboratorios." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contenedores y Orquestación Profesional" />
  <meta name="twitter:description" content="Docker, Docker Compose y Kubernetes: de cero hasta despliegues empresariales." />
  <meta name="twitter:image" content="/og.png" />


  <!-- Anti-FOUC: aplica el tema guardado antes del primer paint (evita el
       destello del tema equivocado al recargar). -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('containerspro-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>
  <script type="module" crossorigin src="/assets/main-LTf889X5.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/vendor-gsap-CiEuWA-R.js">
  <link rel="modulepreload" crossorigin href="/assets/style-CxvtTwsp.js">
  <link rel="stylesheet" crossorigin href="/assets/style-BL35bvly.css">
</head>
<body>

  <!-- Atmósfera global: profundidad índigo + glows + textura.
       Capa fija con parallax al hacer scroll (GSAP ScrollTrigger, atmosphere.js).
       Las partículas ambientales van en una capa hermana, por encima del hero. -->
  <div class="atmosphere" aria-hidden="true">
    <!-- Bandas de lluvia del huracán: arcos que atraviesan TODAS las secciones
         (la tormenta del hero continúa) y giran con el scroll -->
    <div class="atmosphere__bands" aria-hidden="true"></div>
    <!-- Ojo de la tormenta: pared de aurora que orbita el centro y rota con el scroll -->
    <div class="atmosphere__eye" aria-hidden="true"></div>
    <!-- Embudo del vórtice: cono que se abre conforme uno desciende hacia el ojo -->
    <div class="atmosphere__funnel" aria-hidden="true"></div>
  </div>
  <!-- Ráfagas de viento: hilos diagonales que soplan sobre todas las secciones
       y se calman al acercarse al ojo (opacidad atada a --storm) -->
  <div class="storm-streaks" aria-hidden="true"></div>
  <div class="atmosphere__particles" id="atmosphere-particles" aria-hidden="true"></div>

  <!-- Tornado WebGL (Three.js, hero-18): capa de fondo FIJA de toda la página.
       Desciende con el scroll y se disuelve al llegar al ojo calmo del footer
       (initVortexScroll en atmosphere.js desvanece el wrapper). -->
  <div class="hero__vortex-wrap" id="hero-vortex-wrap" aria-hidden="true">
    <div class="hero__vortex" id="hero-vortex"></div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav__inner">
      <span class="nav__logo">
        <i class="ph ph-hexagon nav__logo-icon" aria-hidden="true"></i>
        ContainersPro
      </span>
      <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar a tema claro" aria-pressed="false">
        <i class="ph ph-sun theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"></i>
        <i class="ph ph-moon theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"></i>
      </button>
      <a class="btn btn--outline" id="nav-cta" href="nivel.html?id=0">Inscribirme</a>
    </div>
  </nav>

  <!-- NIVELES: carousel horizontal cinematográfico (prev/activa/siguiente) —
       única sección de la portada, per instrucción del usuario -->
  <section class="niveles" id="niveles" data-glows="niveles">
    <div class="container">
      <div class="niveles__heading">
        <h1 class="hero__title">Contenedores y orquestación <em>profesional</em></h1>
        <p class="hero__sub">De cero hasta despliegues empresariales</p>
      </div>
      <h2 class="section-title">Todos los niveles</h2>
      <p class="section-sub">Navegá el temario nivel por nivel: tu progreso queda guardado en este navegador</p>

      <!-- Continuar donde quedaste (último nivel visitado) -->
      <a class="continue-cta" id="continue-cta" href="nivel.html?id=0">
        <span class="continue-cta__icon"><i class="ph ph-play" aria-hidden="true"></i></span>
        <span class="continue-cta__text">
          <span class="continue-cta__dir">Continuar donde quedaste</span>
          <span class="continue-cta__label">Nivel</span>
        </span>
        <span class="continue-cta__num">00</span>
      </a>
    </div>

    <!-- Carousel cinematográfico: fondo dinámico por etapa, 3 cards
         (prev/activa/siguiente), parallax de mouse y navegación por
         teclado/swipe/flechas. Construido por main/course-experience/. -->
    <div class="course-exp" id="course-exp">
      <div class="course-exp__bg" id="course-exp-bg" aria-hidden="true"></div>
      <div class="course-exp__overlay" aria-hidden="true"></div>
      <div class="course-exp__decor" id="course-exp-visual" aria-hidden="true"></div>

      <header class="course-exp__header">
        <span class="course-exp__brand"><i class="ph ph-hexagon" aria-hidden="true"></i> ContainersPro</span>
        <button type="button" class="course-exp__menu-btn" id="course-exp-menu-btn"
          aria-expanded="false" aria-controls="course-exp-menu">
          <i class="ph ph-list" aria-hidden="true"></i>
          <span>Todos los niveles</span>
        </button>
      </header>

      <div class="course-exp__stage">
        <button type="button" class="course-exp__arrow course-exp__arrow--prev" id="course-exp-prev" aria-label="Nivel anterior">
          <i class="ph ph-caret-left" aria-hidden="true"></i>
        </button>
        <div class="course-exp__cards" id="course-exp-cards" role="list" aria-label="Niveles del curso"></div>
        <button type="button" class="course-exp__arrow course-exp__arrow--next" id="course-exp-next" aria-label="Nivel siguiente">
          <i class="ph ph-caret-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="course-exp__info">
        <h3 class="course-exp__title" id="course-exp-title"></h3>
        <div class="course-exp__metrics" id="course-exp-metrics"></div>
        <div class="course-exp__progress" id="course-exp-progress"></div>
      </div>

      <div class="course-exp__pagination" id="course-exp-pagination"></div>
    </div>

    <!-- Panel "todos los niveles": grilla completa con acordeón (buildNivelCards
         de main/nivel-cards.js), oculta por defecto, se abre desde el botón de
         menú del header del carousel. -->
    <div class="course-exp__menu" id="course-exp-menu" hidden>
      <div class="container">
        <div class="niveles__progress" id="niveles-progress"></div>
        <div class="niveles__grid" id="niveles-grid">
          <!-- generated by main.js: la grilla se construye desde data/niveles.js -->
        </div>
      </div>
    </div>
  </section>

</body>
</html>
